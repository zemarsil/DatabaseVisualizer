services:
  dbviz:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Lets the app create and manage database containers on the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # So the app can reach databases published on the host's loopback interface.
      - "host.docker.internal:host-gateway"
    environment:
      - DEFAULT_DB_HOST=host.docker.internal
    restart: unless-stopped
